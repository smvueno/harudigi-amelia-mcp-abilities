name: Release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'WordPress.org deploy dry-run (no SVN commit)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          REF="${GITHUB_REF_NAME}"
          VER="${REF#v}"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "zip=harudigi-booking-abilities-for-amelia-${VER}.zip" >> "$GITHUB_OUTPUT"
          echo "zip_wporg=harudigi-booking-abilities-for-amelia-${VER}-wporg.zip" >> "$GITHUB_OUTPUT"

      - name: Build GitHub + WordPress.org zips
        run: |
          chmod +x scripts/build-zip.sh
          ./scripts/build-zip.sh github
          ./scripts/build-zip.sh wporg
          cp "dist/${{ steps.ver.outputs.zip }}" .
          cp "dist/${{ steps.ver.outputs.zip_wporg }}" .

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            ${{ steps.ver.outputs.zip }}
            ${{ steps.ver.outputs.zip_wporg }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ## Install
            - **GitHub / direct ZIP** (auto-updates from GitHub Releases): `${{ steps.ver.outputs.zip }}`
            - **WordPress.org review/upload** (no GitHub updater): `${{ steps.ver.outputs.zip_wporg }}`

            Plugin folder slug: `harudigi-booking-abilities-for-amelia`

            Requires **Easy MCP AI** and **Amelia Booking 9.7+**.

            Independent HaruDigi plugin — not affiliated with or endorsed by TMS Software.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Deploys stripped plugin tree to plugins.svn.wordpress.org.
  # Required repo secrets (Settings → Secrets and variables → Actions):
  #   SVN_USERNAME  — WordPress.org username (e.g. smvueno)
  #   SVN_PASSWORD  — WordPress.org SVN password
  #     https://profiles.wordpress.org/me/profile/edit/group/3/?screen=svn-password
  wordpress_org:
    needs: zip
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require SVN secrets
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        run: |
          if [ -z "$SVN_USERNAME" ] || [ -z "$SVN_PASSWORD" ]; then
            echo "::error::Add repo secrets SVN_USERNAME and SVN_PASSWORD, then re-run."
            exit 1
          fi

      - name: Strip GitHub updater for wordpress.org
        run: |
          chmod +x scripts/prepare-wporg-checkout.sh
          ./scripts/prepare-wporg-checkout.sh

      - name: Deploy to WordPress.org SVN
        uses: 10up/action-wordpress-plugin-deploy@2.3.0
        with:
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: harudigi-booking-abilities-for-amelia
