name: Release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          REF="${GITHUB_REF_NAME}"
          VER="${REF#v}"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "zip=harudigi-booking-abilities-for-amelia-${VER}.zip" >> "$GITHUB_OUTPUT"
          echo "zip_wporg=harudigi-booking-abilities-for-amelia-${VER}-wporg.zip" >> "$GITHUB_OUTPUT"
          # keep names aligned with scripts/build-zip.sh

      - name: Build GitHub + WordPress.org zips
        run: |
          chmod +x scripts/build-zip.sh
          ./scripts/build-zip.sh github
          ./scripts/build-zip.sh wporg
          cp "dist/${{ steps.ver.outputs.zip }}" .
          cp "dist/${{ steps.ver.outputs.zip_wporg }}" .

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            ${{ steps.ver.outputs.zip }}
            ${{ steps.ver.outputs.zip_wporg }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ## Install
            - **GitHub / direct ZIP** (auto-updates from GitHub Releases): `${{ steps.ver.outputs.zip }}`
            - **WordPress.org review/upload** (no GitHub updater): `${{ steps.ver.outputs.zip_wporg }}`

            Plugin folder slug: `harudigi-booking-abilities-for-amelia`

            Requires **Easy MCP AI** and **Amelia Booking 9.7+**.

            Independent HaruDigi plugin — not affiliated with or endorsed by TMS Software.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
