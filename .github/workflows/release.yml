name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'WordPress.org deploy dry-run (no SVN commit)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          REF="${GITHUB_REF_NAME}"
          VER="${REF#v}"
          if [[ ! "$VER" =~ ^[0-9]+\.[0-9]+ ]]; then
            VER="$(grep -E '^\s*\*\s*Version:' harudigi-booking-abilities-for-amelia.php | head -1 | sed -E 's/.*Version:[[:space:]]*//' | tr -d '[:space:]')"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "zip=harudigi-booking-abilities-for-amelia-${VER}.zip" >> "$GITHUB_OUTPUT"
          echo "zip_wporg=harudigi-booking-abilities-for-amelia-${VER}-wporg.zip" >> "$GITHUB_OUTPUT"

      - name: Sync changelog (readme + require notes)
        run: |
          python3 scripts/changelog.py check --version "${{ steps.ver.outputs.version }}"

      - name: Build release body
        run: |
          python3 scripts/changelog.py github-body "${{ steps.ver.outputs.version }}" > release-body.md
          cat release-body.md

      - name: Build GitHub + WordPress.org zips
        run: |
          chmod +x scripts/build-zip.sh
          ./scripts/build-zip.sh github
          ./scripts/build-zip.sh wporg
          cp "dist/${{ steps.ver.outputs.zip }}" .
          cp "dist/${{ steps.ver.outputs.zip_wporg }}" .

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: v${{ steps.ver.outputs.version }}
          files: |
            ${{ steps.ver.outputs.zip }}
            ${{ steps.ver.outputs.zip_wporg }}
          fail_on_unmatched_files: true
          body_path: release-body.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  wordpress_org:
    needs: zip
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require SVN secrets
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        run: |
          if [ -z "$SVN_USERNAME" ] || [ -z "$SVN_PASSWORD" ]; then
            echo "::error::Add repo secrets SVN_USERNAME and SVN_PASSWORD, then re-run."
            exit 1
          fi

      - name: Sync changelog into readme.txt
        run: python3 scripts/changelog.py sync

      - name: Strip GitHub updater for wordpress.org
        run: |
          chmod +x scripts/prepare-wporg-checkout.sh
          ./scripts/prepare-wporg-checkout.sh

      - name: Deploy to WordPress.org SVN
        uses: 10up/action-wordpress-plugin-deploy@2.3.0
        with:
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: harudigi-booking-abilities-for-amelia
